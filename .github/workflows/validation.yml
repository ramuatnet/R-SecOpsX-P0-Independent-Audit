name: validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  golden-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run golden corpus validation
        run: python -m analysis.validation.run --corpus tests/vuln-test-corpus

  version-fuzzing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run version comparator fuzzing
        run: python -m analysis.validation.fuzz_versions --count 1000

  v0-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V0 unit tests
        run: pytest tests/test_v01_golden_corpus.py tests/test_v02_normalizer_comparator.py tests/test_v03_differential.py -v --tb=short

  phase0-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 0 security gate tests
        run: pytest tests/test_phase0_security_gate.py tests/test_phase0_gate_metadata.py -v --tb=short

  ci-matrix:
    runs-on: ubuntu-latest
    needs: [golden-corpus, version-fuzzing, v0-unit-tests, phase0-gate-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full CI validation matrix
        run: python -m analysis.validation.ci_matrix
