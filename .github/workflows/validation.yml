name: validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  golden-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run golden corpus validation
        run: python -m analysis.validation.run --corpus tests/vuln-test-corpus

  version-fuzzing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run version comparator fuzzing
        run: python -m analysis.validation.fuzz_versions --count 1000

  v0-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        # pytest is not preinstalled on the runner; the product itself stays
        # stdlib-only, but the test runner is a dev-time dependency.
        run: python -m pip install pytest
      - name: Run V0 unit tests
        run: pytest tests/test_v01_golden_corpus.py tests/test_v02_normalizer_comparator.py tests/test_v03_differential.py -v --tb=short

  phase0-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run Phase 0 security gate tests
        run: pytest tests/test_phase0_security_gate.py tests/test_phase0_gate_metadata.py -v --tb=short

  phase4-bom-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BOM schema validation dependencies
        run: pip install jsonschema requests pytest
      - name: Run Phase 4 CBOM/AI-BOM conformance tests
        run: pytest tests/test_phase4_cbom_conformance.py -v --tb=short

  e2e-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies: the CLI is stdlib-only at import time (PDF/Excel
      # renderers import lazily and the harness scans with --no-pdf
      # --no-excel), and the harness copies each fixture to a temp dir so
      # the secrets scanner's known-signature layer runs as it would on a
      # real target.
      - name: Run end-to-end pipeline validation
        run: python -m analysis.validation.e2e

  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run detection mutation testing
        run: python -m analysis.validation.mutation

  owasp-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone OWASP BenchmarkJava (shallow)
        run: git clone --depth 1 https://github.com/OWASP-Benchmark/BenchmarkJava.git "$RUNNER_TEMP/BenchmarkJava"
      # Report-only by design: absolute recall against an external oracle is
      # a measurement, not a pass/fail contract -- the job surfaces metric
      # drift in the log (per-category recall and false-positive rate) and
      # fails only when the harness itself errors. Add --min-recall to turn
      # it into a regression gate once a floor is agreed.
      - name: Score R-SecOpsX against BenchmarkJava
        run: python -m analysis.validation.owasp_benchmark --benchmark-dir "$RUNNER_TEMP/BenchmarkJava"

  # Dogfood: every PR runs R-SecOpsX over its own checkout and decorates the
  # PR with the sticky summary (reporting/pr_decoration.py builds the body
  # offline; the composite action only upserts it). PR-only on purpose -- the
  # comment has no meaning on push. Deliberately NOT in ci-matrix's `needs`:
  # a needs-edge onto a skipped job skips the dependent job, so listing it
  # would silence ci-matrix on every push.
  pr-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rsecopsx-scan
        with:
          target: "."

  ci-matrix:
    runs-on: ubuntu-latest
    needs: [golden-corpus, version-fuzzing, v0-unit-tests, phase0-gate-tests, phase4-bom-conformance, e2e-pipeline, mutation-testing, owasp-benchmark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        # ci_matrix re-runs the v0/phase0 pytest suites internally, so this
        # job needs the test runner too (same dev-time dependency as the
        # standalone test jobs above).
        run: python -m pip install pytest
      - name: Run full CI validation matrix
        run: python -m analysis.validation.ci_matrix
