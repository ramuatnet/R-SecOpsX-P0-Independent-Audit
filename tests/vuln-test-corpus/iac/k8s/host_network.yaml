apiVersion: v1
kind: Pod
metadata:
  name: mesh-proxy
spec:
  hostNetwork: true
  containers:
    - name: proxy
      image: acme/proxy:2.1.0
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "250m"
          memory: "128Mi"
