apiVersion: v1
kind: Pod
metadata:
  name: agent
spec:
  containers:
    - name: agent
      image: acme/agent:1.4.2
      securityContext:
        runAsNonRoot: true
        privileged: true
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
