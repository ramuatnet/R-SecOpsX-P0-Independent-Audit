schema: 'rsecopsx.rules/v1'
rules:
  - id: 'AWS_ACCESS_KEY'
    title: 'AWS Access Key'
    vuln: 'hardcoded_secret'
    sev: 'Critical'
    cwe: 'CWE-798'
    owasp: 'A07:2021 - Identification and Authentication Failures'
    pattern: 'AKIA[0-9A-Z]{16}'
    flags: ''
    contract_ref: 'hardcoded_secret'
    note: 'AWS access key ID detected in source code.'
  - id: 'GITHUB_TOKEN'
    title: 'GitHub Token'
    vuln: 'hardcoded_secret'
    sev: 'Critical'
    cwe: 'CWE-798'
    owasp: 'A07:2021 - Identification and Authentication Failures'
    pattern: 'ghp_[A-Za-z0-9]{36}'
    flags: 'ims'
    contract_ref: 'hardcoded_secret'
    note: 'GitHub personal access token detected in source code.'
  - id: 'GENERIC_API_KEY_PASSWORD'
    title: 'Generic API Key/Password'
    vuln: 'hardcoded_secret'
    sev: 'Critical'
    cwe: 'CWE-798'
    owasp: 'A07:2021 - Identification and Authentication Failures'
    pattern: '(?:api[_-]?key|api[_-]?token|secret[_-]?key|auth[_-]?token|access[_-]?token|password|passwd|pwd)\s*[:=]\s*(?P<q>["\''])(?P<credval>[A-Za-z0-9@#$%^&+=!_.\-/]{8,})(?P=q)'
    flags: 'ims'
    contract_ref: 'hardcoded_secret'
    note: 'Possible hardcoded credential or API key.'
  - id: 'HARDCODED_CREDENTIAL_COMPARISON'
    title: 'Hardcoded credential authorization comparison'
    vuln: 'hardcoded_secret'
    sev: 'Critical'
    cwe: 'CWE-798'
    owasp: 'A07:2021 - Identification and Authentication Failures'
    pattern: '\b(?:if|elif|while)\s+(?:not\s+)?[\w.\[\]]*(?<![A-Za-z0-9])(?:api[_-]?key|apikey|access[_-]?key|password|passwd|pwd|passphrase|secret|token|credential)(?:[_\-0-9][\w]*)?\s*(?:==|!=|not\s+in)\s*[\"''](?P<credval>[^\"''\s]{1,128})[\"'']'
    flags: 'ims'
    contract_ref: 'hardcoded_secret'
    note: 'A credential-named value is compared against a literal, so the secret is committed to source and doubles as the authorization check.'
  - id: 'PRIVATE_KEY_HEADER'
    title: 'Private Key Header'
    vuln: 'hardcoded_secret'
    sev: 'Critical'
    cwe: 'CWE-798'
    owasp: 'A07:2021 - Identification and Authentication Failures'
    pattern: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
    flags: 'ims'
    contract_ref: 'hardcoded_secret'
    note: 'Private key material in source code.'
  - id: 'MD5_USAGE'
    title: 'MD5 Usage'
    vuln: 'weak_crypto'
    sev: 'High'
    cwe: 'CWE-327'
    owasp: 'A02:2021 - Cryptographic Failures'
    pattern: 'hashlib\.md5\s*\(|MessageDigest\.getInstance\s*\(\s*[\"'']MD5|MD5CryptoServiceProvider|crypto\.createHash\s*\(\s*[\"'']md5|(?<![\w.])md5\s*\('
    flags: 'ims'
    contract_ref: 'weak_crypto'
    note: 'MD5 is cryptographically broken.'
  - id: 'SHA1_USAGE'
    title: 'SHA-1 Usage'
    vuln: 'weak_crypto'
    sev: 'High'
    cwe: 'CWE-327'
    owasp: 'A02:2021 - Cryptographic Failures'
    pattern: 'hashlib\.sha1\s*\(|MessageDigest\.getInstance\s*\(\s*[\"'']SHA-?1|SHA1CryptoServiceProvider|crypto\.createHash\s*\(\s*[\"'']sha1|(?<![\w.])sha1\s*\('
    flags: 'ims'
    contract_ref: 'weak_crypto'
    note: 'SHA-1 is deprecated for cryptographic use.'
  - id: 'FLASK_DEBUG'
    title: 'Flask Debug Mode'
    vuln: 'debug_exposure'
    sev: 'High'
    cwe: 'CWE-215'
    owasp: 'A05:2021 - Security Misconfiguration'
    pattern: 'app\.run\s*\([^)]*debug\s*=\s*True'
    flags: 'ims'
    note: 'Flask debug=True exposes interactive debugger in production.'
  - id: 'SUBPROCESS_SHELL_TRUE'
    title: 'subprocess shell=True'
    vuln: 'command_injection'
    sev: 'Critical'
    cwe: 'CWE-78'
    owasp: 'A03:2021 - Injection'
    pattern: 'subprocess\.\w+\s*\([^)]*shell\s*=\s*True'
    flags: 'ims'
    contract_ref: 'command_injection'
    note: 'subprocess with shell=True enables shell injection.'
  - id: 'OS_SYSTEM'
    title: 'os.system Call'
    vuln: 'command_injection'
    sev: 'Critical'
    cwe: 'CWE-78'
    owasp: 'A03:2021 - Injection'
    pattern: 'os\.system\s*\('
    flags: 'ims'
    contract_ref: 'command_injection'
    note: 'os.system executes shell commands.'
  - id: 'EVAL_CALL'
    title: 'eval() Call'
    vuln: 'code_injection'
    sev: 'Critical'
    cwe: 'CWE-94'
    owasp: 'A03:2021 - Injection'
    pattern: '(?<![\w.])eval\s*\(|(?<=window\.)eval\s*\(|(?<=globalThis\.)eval\s*\(|(?<=builtins\.)eval\s*\('
    flags: 'ims'
    contract_ref: 'code_injection'
    note: 'eval() executes arbitrary code.'
  - id: 'PYTHON_EXEC_CALL'
    title: 'Python exec() Call'
    vuln: 'code_injection'
    sev: 'Critical'
    langs: ['python']
    cwe: 'CWE-94'
    owasp: 'A03:2021 - Injection'
    pattern: '(?<![.\w])exec\s*\('
    flags: 'ims'
    contract_ref: 'code_injection'
    note: 'Python exec() executes arbitrary code.'
  - id: 'PYTHON_PICKLE_LOADS'
    title: 'Python pickle.loads Insecure Deserialization'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['python']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'pickle\.loads\s*\('
    flags: 'ims'
    contract_ref: 'insecure_deserialization'
    note: 'pickle.loads deserializes untrusted data.'
  - id: 'PYTHON_PICKLE_LOAD'
    title: 'Python pickle.load Insecure Deserialization'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['python']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'pickle\.load\s*\('
    flags: 'ims'
    contract_ref: 'insecure_deserialization'
    note: 'pickle.load deserializes untrusted data from a file.'
  - id: 'PYTHON_TORCH_LOAD_UNSAFE'
    title: 'Python torch.load Without weights_only Guard'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['python']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'torch\.load\s*\((?!(?:(?!torch\.load\s*\()[\s\S]){0,300}weights_only\s*=\s*True)'
    flags: 'ims'
    contract_ref: 'insecure_deserialization'
    note: 'torch.load unpickles the checkpoint; without weights_only=True a tampered file executes arbitrary code on load.'
  - id: 'PYTHON_TRANSFORMERS_REMOTE_CODE'
    title: 'transformers trust_remote_code=True'
    vuln: 'code_injection'
    sev: 'High'
    langs: ['python']
    cwe: 'CWE-94'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'trust_remote_code\s*=\s*True'
    flags: 'ims'
    contract_ref: 'code_injection'
    note: 'trust_remote_code=True executes modeling code from the model repository instead of the installed library.'
  - id: 'PYTHON_RENDER_STRING'
    title: 'Python Flask render_string Template Injection'
    vuln: 'template_injection'
    sev: 'Critical'
    langs: ['python']
    cwe: 'CWE-94'
    owasp: 'A03:2021 - Injection'
    pattern: 'render_string\s*\('
    flags: 'ims'
    note: 'render_string with user-controlled template enables SSTI.'
  - id: 'PYTHON_JINJA_FROM_STRING'
    title: 'Python from_string Template Injection (Jinja2 SSTI)'
    vuln: 'template_injection'
    sev: 'Critical'
    langs: ['python']
    cwe: 'CWE-94'
    owasp: 'A03:2021 - Injection'
    pattern: 'from_string\s*\('
    flags: 'ims'
    note: 'from_string compiles template syntax held in a string at runtime; attacker-controlled template text is server-side template injection (SSTI, CWE-94).'
