schema: 'rsecopsx.rules/v1'
rules:
  - id: 'NODE_CHILD_PROCESS_EXEC'
    title: 'Node.js child_process.exec Command Execution'
    vuln: 'command_injection'
    sev: 'Critical'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-78'
    owasp: 'A03:2021 - Injection'
    pattern: '\bchild_process\.(?:exec|execSync|execFile|execFileSync)\s*\('
    contract_ref: 'command_injection'
  - id: 'NODE_IMPORTED_CHILD_PROCESS_EXEC'
    title: 'Node.js imported child_process.exec Command Execution'
    vuln: 'command_injection'
    sev: 'Critical'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-78'
    owasp: 'A03:2021 - Injection'
    pattern: '(?<![.\w])(?:exec|execSync|execFile|execFileSync)\s*\('
    contract_ref: 'command_injection'
  - id: 'PY_TLS_CERT_VALIDATION_DISABLED'
    title: 'Python TLS Certificate Validation Disabled'
    vuln: 'tls_bypass'
    sev: 'Critical'
    langs: ['python']
    cwe: 'CWE-295'
    owasp: 'A02:2021 - Cryptographic Failures'
    pattern: '\bverify\s*=\s*False\b|\bcheck_hostname\s*=\s*False\b|ssl\._create_unverified_context\s*\(|verify_mode\s*=\s*ssl\.CERT_NONE'
  - id: 'PY_COOKIE_MISSING_SECURE'
    title: 'Cookie Missing Secure Flag'
    vuln: 'insecure_cookie_secure_flag'
    sev: 'Medium'
    langs: ['python']
    cwe: 'CWE-614'
    owasp: 'A05:2021 - Security Misconfiguration'
    pattern: '\.set_cookie\s*\('
  - id: 'PY_COOKIE_MISSING_HTTPONLY'
    title: 'Cookie Missing HttpOnly Flag'
    vuln: 'insecure_cookie_httponly_flag'
    sev: 'Medium'
    langs: ['python']
    cwe: 'CWE-1004'
    owasp: 'A04:2021 - Insecure Design'
    pattern: '\.set_cookie\s*\('
  - id: 'PY_COOKIE_MISSING_SAMESITE'
    title: 'Cookie Missing SameSite Restriction'
    vuln: 'insecure_cookie_samesite_flag'
    sev: 'Medium'
    langs: ['python']
    cwe: 'CWE-1275'
    owasp: 'A05:2021 - Security Misconfiguration'
    pattern: '\.set_cookie\s*\('
  - id: 'DJANGO_CSRF_EXEMPT'
    title: 'Django View Exempted from CSRF Protection'
    vuln: 'auth_misconfiguration'
    sev: 'Medium'
    langs: ['python']
    cwe: 'CWE-352'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: '@(?:method_decorator\s*\(\s*)?csrf_exempt\b'
  - id: 'JAVA_OBJECTINPUTSTREAM_DESERIALIZATION'
    title: 'Java ObjectInputStream Insecure Deserialization'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'new\s+ObjectInputStream\s*\(|\.readObject\s*\('
    contract_ref: 'insecure_deserialization'
  - id: 'JAVA_JACKSON_DEFAULT_TYPING'
    title: 'Jackson Unsafe Default Typing'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'enableDefaultTyping\s*\(|activateDefaultTyping\s*\(|DefaultTyping\.|@JsonTypeInfo|ObjectMapper[\s\S]{0,200}enableDefaultTyping'
    contract_ref: 'insecure_deserialization'
  - id: 'JAVA_SNAKEYAML_UNSAFE_LOAD'
    title: 'SnakeYAML Unsafe Load'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: '(?:new\s+Yaml\s*\([^)]*\)|Yaml\s+\w+\s*=\s*new\s+Yaml\s*\([^)]*\))[\s\S]{0,240}\.load\s*\(|\.load\s*\([^)]*(?:request|getParameter|input|payload|body)'
    contract_ref: 'insecure_deserialization'
  - id: 'JAVA_XSTREAM_DESERIALIZATION'
    title: 'XStream Insecure Deserialization'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'new\s+XStream\s*\(|\.fromXML\s*\([^)]*(?:request|getParameter|input|payload|body)?'
    contract_ref: 'insecure_deserialization'
  - id: 'JAVA_JNDI_LOG4SHELL_LOOKUP'
    title: 'JNDI / Log4Shell-style Lookup Pattern'
    vuln: 'jndi_injection'
    sev: 'Critical'
    langs: ['java', 'properties', 'xml', 'yaml']
    cwe: 'CWE-917'
    owasp: 'A03:2021 - Injection'
    pattern: '\$\{\s*jndi\s*:\s*(?:ldap|rmi|dns|iiop)://|InitialContext\s*\(|\.lookup\s*\('
  - id: 'JAVA_JDBC_SQL_CONCAT'
    title: 'JDBC SQL Concatenation'
    vuln: 'sql_injection'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-89'
    owasp: 'A03:2021 - Injection'
    pattern: '(?:createStatement\s*\(\s*\)|prepareStatement\s*\(\s*\"[^\"]*\"\s*\+|executeQuery\s*\(\s*\"[^\"]*\"\s*\+)'
    contract_ref: 'sql_injection'
  - id: 'JAVA_HQL_JPQL_INJECTION'
    title: 'Hibernate HQL / JPQL Injection'
    vuln: 'orm_injection'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-89'
    owasp: 'A03:2021 - Injection'
    pattern: 'createQuery\s*\(\s*\"[^\"]*(?:from|select|where)[^\"]*\"\s*\+|@Query\s*\(\s*\"[^\"]*\"\s*\+'
  - id: 'JAVA_JOOQ_RAW_SQL'
    title: 'jOOQ Raw SQL Injection Indicator'
    vuln: 'orm_injection'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-89'
    owasp: 'A03:2021 - Injection'
    pattern: 'DSL\.query\s*\(\s*\"[^\"]*\"\s*\+|fetch\s*\(\s*\"[^\"]*\"\s*\+'
  - id: 'JAVA_XPATH_INJECTION'
    title: 'Java XPath Query Built by Concatenation'
    vuln: 'xpath_injection'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-643'
    owasp: 'A03:2021 - Injection'
    pattern: '\"[^\"]*(?:\[@|//|text\(\)|contains\(|starts-with\()[^\"]*\"\s*\+\s*\w+'
  - id: 'JAVA_XXE_PARSER'
    title: 'Java XML Parser XXE Risk'
    vuln: 'xxe'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-611'
    owasp: 'A05:2021 - Security Misconfiguration'
    pattern: 'DocumentBuilderFactory\.newInstance\s*\(|SAXParserFactory\.newInstance\s*\(|XMLInputFactory\.newInstance\s*\(|SAXReader\s*\('
    contract_ref: 'xxe'
  - id: 'JAVA_REFLECTION_SETACCESSIBLE'
    title: 'Dangerous Reflection setAccessible(true)'
    vuln: 'dangerous_reflection'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-470'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: '\.setAccessible\s*\(\s*true\s*\)'
  - id: 'JAVA_PATH_TRAVERSAL_FILE'
    title: 'Java Path Traversal File Access'
    vuln: 'path_traversal'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-22'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'new\s+File\s*\([^)]*(?:request|getParameter|path|filename)|Paths\.get\s*\([^)]*(?:request|getParameter|path|filename)'
    contract_ref: 'path_traversal'
  - id: 'JAVA_TLS_TRUST_BYPASS'
    title: 'Java TLS TrustManager / HostnameVerifier Bypass'
    vuln: 'tls_bypass'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-295'
    owasp: 'A02:2021 - Cryptographic Failures'
    pattern: 'X509TrustManager|HostnameVerifier|verify\s*\([^)]*\)\s*\{\s*return\s+true|checkServerTrusted\s*\([^)]*\)\s*\{\s*\}'
    remediation: ['Remove permissive TrustManager and HostnameVerifier implementations.', 'Use the default JVM trust store or managed certificate pinning.', 'Fail closed on certificate and hostname validation errors.']
  - id: 'SPRING_SPEL_INJECTION'
    title: 'Spring SpEL Injection Indicator'
    vuln: 'spel_injection'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-94'
    owasp: 'A03:2021 - Injection'
    pattern: 'parseExpression\s*\([^)]*(?:request|getParameter|@RequestParam|@PathVariable|param|input)|SpelExpressionParser[\s\S]{0,240}parseExpression\s*\('
    evidence_pat: 'parseExpression\s*\('
    remediation: ['Never evaluate user-controlled input with SpEL parseExpression().', 'Replace dynamic expressions with allow-listed operations or server-side enum choices.', 'Use SimpleEvaluationContext where expression evaluation is unavoidable.', 'Reject expressions containing type references, method calls, constructors or bean references.']
  - id: 'SPRING_MASS_ASSIGNMENT_ENTITY_BINDING'
    title: 'Spring MVC Mass Assignment Entity Binding'
    vuln: 'mass_assignment'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-915'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: '@(RequestBody|ModelAttribute)\s+(?:User|Account|Admin|Role|Customer|Order|.*Entity)\b'
    remediation: ['Bind requests to explicit DTOs rather than JPA/domain entities.', 'Use allow-listed fields and ignore role, tenantId, isAdmin, status, balance and permission fields.', 'Validate with @Valid/@Validated and enforce server-side authorization after binding.']
  - id: 'SPRING_SECURITY_CSRF_DISABLED'
    title: 'Spring Security CSRF Disabled'
    vuln: 'auth_misconfiguration'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-352'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'csrf\s*\(\s*\)\s*\.disable\s*\(|csrf\s*\(\s*csrf\s*->\s*csrf\.disable\s*\('
    remediation: ['Do not globally disable CSRF protection for browser-based sessions.', 'Enable CSRF for state-changing endpoints or use stateless token-based APIs with explicit compensating controls.', 'Avoid broad anyRequest().permitAll() and require authenticated authorization rules by default.', 'Add security tests for unauthenticated state-changing requests.']
  - id: 'SPRING_PERMITALL_BROAD_MATCHER'
    title: 'Spring Security Broad permitAll Exposure'
    vuln: 'auth_misconfiguration'
    sev: 'Critical'
    langs: ['java']
    cwe: 'CWE-284'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: '(?:antMatchers|requestMatchers)\s*\([^)]*(?:/\*\*|\*)[^)]*\)\s*\.permitAll\s*\('
  - id: 'SPRING_ACTUATOR_EXPOSE_ALL'
    title: 'Spring Actuator All Endpoints Exposed'
    vuln: 'actuator_exposure'
    sev: 'Critical'
    langs: ['properties', 'yaml', 'java']
    cwe: 'CWE-200'
    owasp: 'A05:2021 - Security Misconfiguration'
    pattern: 'management\.endpoints\.web\.exposure\.include\s*[:=]\s*[\"'']?\*[\"'']?|exposure:\s*\n\s*include:\s*[\"'']?\*[\"'']?'
    evidence_pat: 'include\s*[:=]\s*[\"'']?\*[\"'']?'
    remediation: ['Do not expose all actuator endpoints in production.', 'Set management.endpoints.web.exposure.include to a minimal allow-list such as health/info only.', 'Protect actuator endpoints with Spring Security and network ACLs.', 'Disable sensitive endpoints such as env, beans, heapdump, threaddump, mappings and configprops.']
  - id: 'SPRING_MULTIPART_TRAVERSAL'
    title: 'Spring MultipartFile Unsafe Upload Path'
    vuln: 'path_traversal'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-22'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'MultipartFile|getOriginalFilename\s*\(\s*\)|transferTo\s*\(\s*new\s+File'
    contract_ref: 'path_traversal'
  - id: 'SPRING_ASYNC_CONTEXT_LOSS'
    title: 'Spring @Async Security Context Loss Indicator'
    vuln: 'async_security_context_loss'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-362'
    owasp: 'A04:2021 - Insecure Design'
    pattern: '@Async(?![\s\S]{0,250}(DelegatingSecurityContext|SecurityContextHolder))'
  - id: 'SPRING_CACHEABLE_USER_KEY'
    title: 'Spring @Cacheable User-Controlled Key'
    vuln: 'cache_key_injection'
    sev: 'Medium'
    langs: ['java']
    cwe: 'CWE-20'
    owasp: 'A04:2021 - Insecure Design'
    pattern: '@Cacheable\s*\([^)]*key\s*=\s*[\"''][^\"'']*#(?:user|request|param|id)'
  - id: 'JAVA_TEMPLATE_INJECTION'
    title: 'Java Template Injection Indicator'
    vuln: 'template_injection'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-94'
    owasp: 'A03:2021 - Injection'
    pattern: 'TemplateEngine\.process\s*\([^)]*(?:request|getParameter)|Freemarker|VelocityEngine|StringTemplateResolver'
    remediation: ['Do not treat user input as template source or template name.', 'Use fixed server-side template names and pass user input only as escaped model data.', 'Disable unrestricted template resolvers and expression utilities.']
  - id: 'SPRING_WEBFLUX_AUTH_GAP'
    title: 'Spring WebFlux Authorization Propagation Gap'
    vuln: 'auth_misconfiguration'
    sev: 'High'
    langs: ['java']
    cwe: 'CWE-284'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'RouterFunctions\.route\s*\(|SecurityWebFilterChain|authorizeExchange\s*\(\s*\)\s*\.anyExchange\s*\(\s*\)\s*\.permitAll'
  - id: 'SPRING_MISSING_VALIDATION'
    title: 'Spring Missing @Valid / @Validated Indicator'
    vuln: 'missing_validation'
    sev: 'Medium'
    langs: ['java']
    cwe: 'CWE-20'
    owasp: 'A04:2021 - Insecure Design'
    pattern: '@(PostMapping|PutMapping|PatchMapping)(?:(?!@(?:Valid|Validated))[\s\S]){0,250}@(RequestBody|ModelAttribute)(?![\s\S]{0,80}@(?:Valid|Validated))'
  - id: 'DOTNET_BINARYFORMATTER'
    title: '.NET BinaryFormatter Deserialization'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['csharp']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'BinaryFormatter\s*\(|\.Deserialize\s*\('
    contract_ref: 'insecure_deserialization'
  - id: 'DOTNET_TYPENAMEHANDLING'
    title: 'Json.NET TypeNameHandling Unsafe'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['csharp']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'TypeNameHandling\s*=\s*TypeNameHandling\.(?:All|Auto|Objects|Arrays)'
    contract_ref: 'insecure_deserialization'
  - id: 'DOTNET_DATACONTRACT_DESERIALIZER'
    title: 'DataContractSerializer Unsafe Deserialization'
    vuln: 'insecure_deserialization'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: '(?:DataContractSerializer|NetDataContractSerializer)\s*\(|\.ReadObject\s*\([^)]*(?:Request|Body|Stream|input|payload)?'
    contract_ref: 'insecure_deserialization'
  - id: 'DOTNET_ADO_SQL_CONCAT'
    title: 'ADO.NET SQL Concatenation'
    vuln: 'sql_injection'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-89'
    owasp: 'A03:2021 - Injection'
    pattern: 'SqlCommand\s*\(\s*\"[^\"]*\"\s*\+|CommandText\s*=\s*\"[^\"]*\"\s*\+'
    contract_ref: 'sql_injection'
  - id: 'DOTNET_EF_FROMSQLRAW_INTERPOLATION'
    title: 'Entity Framework FromSqlRaw Interpolation'
    vuln: 'orm_injection'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-89'
    owasp: 'A03:2021 - Injection'
    pattern: 'FromSqlRaw\s*\(\s*\$\"|FromSqlRaw\s*\([^)]*\+'
  - id: 'DOTNET_XXE_DTD_PROCESSING'
    title: '.NET XML DTD Processing / XXE'
    vuln: 'xxe'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-611'
    owasp: 'A05:2021 - Security Misconfiguration'
    pattern: 'DtdProcessing\s*=\s*DtdProcessing\.Parse|XmlResolver\s*=\s*new\s+XmlUrlResolver|XmlDocument\s*\('
    contract_ref: 'xxe'
  - id: 'DOTNET_PATH_COMBINE_TRAVERSAL'
    title: '.NET Path.Combine Traversal Indicator'
    vuln: 'path_traversal'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-22'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'Path\.Combine\s*\([^)]*(?:Request|Query|Form|Route|file|path|name)'
    contract_ref: 'path_traversal'
  - id: 'DOTNET_ZIPSLIP_EXTRACT'
    title: '.NET ZipSlip Extraction Risk'
    vuln: 'zipslip'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-22'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'ZipFile\.ExtractToDirectory\s*\(|ZipArchive[\s\S]{0,300}(?:ExtractToFile|FullName)'
  - id: 'DOTNET_OVERPOSTING'
    title: 'ASP.NET Mass Assignment / Overposting'
    vuln: 'mass_assignment'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-915'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'public\s+(?:IActionResult|Task<[^>]+>)\s+\w+\s*\([^)]*(?:User|Account|Role|Admin|.*Entity)\s+\w+'
  - id: 'DOTNET_OPEN_REDIRECT'
    title: 'ASP.NET Open Redirect'
    vuln: 'open_redirect'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-601'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'Redirect\s*\(\s*(?:returnUrl|url|Request\.)'
    contract_ref: 'open_redirect'
  - id: 'DOTNET_CERT_VALIDATION_BYPASS'
    title: 'HttpClient Certificate Validation Bypass'
    vuln: 'tls_bypass'
    sev: 'Critical'
    langs: ['csharp']
    cwe: 'CWE-295'
    owasp: 'A02:2021 - Cryptographic Failures'
    pattern: 'ServerCertificateCustomValidationCallback\s*=\s*.*=>\s*true|DangerousAcceptAnyServerCertificateValidator'
    remediation: ['Remove DangerousAcceptAnyServerCertificateValidator and callbacks returning true.', 'Use default HttpClient certificate validation and trusted roots.', 'Pin certificates only with explicit rotation procedures.']
  - id: 'DOTNET_LOG_INJECTION'
    title: 'ILogger Raw User Input Log Injection'
    vuln: 'log_injection'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-117'
    owasp: 'A09:2021 - Security Logging and Monitoring Failures'
    pattern: '(?:ILogger|_logger)\.(?:Information|Error|Warning|Debug|LogInformation|LogError|LogWarning)\s*\([^)]*(?:Request|Query|Form|Headers|userInput|returnUrl|User\.Identity)'
    contract_ref: 'log_injection'
    remediation: ['Use structured logging placeholders instead of concatenating raw user input.', 'Normalize CR/LF and control characters before logging.', 'Do not log secrets, tokens, cookies or raw request bodies.']
  - id: 'DOTNET_HARDCODED_CREDENTIAL'
    title: '.NET Hardcoded Credential in String Declaration'
    vuln: 'hardcoded_secret'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-798'
    owasp: 'A07:2021 - Identification and Authentication Failures'
    pattern: '(?:string|var|const\s+string)\s+(?P<ident>\w+)\s*=\s*\"[^\"]{8,}\"'
    contract_ref: 'hardcoded_secret'
  - id: 'DOTNET_PROCESS_START_INFO'
    title: '.NET ProcessStartInfo with User-Controlled Arguments'
    vuln: 'command_injection'
    sev: 'Critical'
    langs: ['csharp']
    cwe: 'CWE-78'
    owasp: 'A03:2021 - Injection'
    pattern: 'ProcessStartInfo\s*\([^)]*\w+|\.Start\s*\(\s*\)'
    contract_ref: 'command_injection'
  - id: 'DOTNET_COMMAND_CONCAT'
    title: '.NET Command Arguments String Concatenation'
    vuln: 'command_injection'
    sev: 'Critical'
    langs: ['csharp']
    cwe: 'CWE-78'
    owasp: 'A03:2021 - Injection'
    pattern: 'Arguments\s*=\s*\"[^\"]*(?:/c |/k |cmd\.exe|powershell|bash)[^\"]*\"\s*\+\s*\w+'
    contract_ref: 'command_injection'
  - id: 'DOTNET_SQL_INTERPOLATED'
    title: '.NET SqlCommand with Interpolated SQL String'
    vuln: 'sql_injection'
    sev: 'High'
    langs: ['csharp']
    cwe: 'CWE-89'
    owasp: 'A03:2021 - Injection'
    pattern: 'SqlCommand\s*\(\s*\$\"|\.ExecuteReader\s*\(\s*\)|\.ExecuteScalar\s*\(\s*\)'
    contract_ref: 'sql_injection'
  - id: 'NODE_PROTOTYPE_POLLUTION_MERGE'
    title: 'Node Prototype Pollution Merge'
    vuln: 'prototype_pollution'
    sev: 'High'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-1321'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'Object\.assign\s*\([^)]*(?:req\.|body|query)|(?:lodash|_|deepmerge|merge)\.merge\s*\([^)]*(?:req\.|body|query)|qs\.parse\s*\('
    contract_ref: 'prototype_pollution'
  - id: 'NODE_CHILD_PROCESS_EXEC'
    title: 'Node child_process.exec Command Injection'
    vuln: 'command_injection'
    sev: 'Critical'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-78'
    owasp: 'A03:2021 - Injection'
    pattern: 'child_process\.(?:exec|execSync|execFile|execFileSync)\s*\(|(?:\bexec|execSync)\s*\([^)]*(?:req\.|query|body)'
    contract_ref: 'command_injection'
  - id: 'NODE_UNSAFE_EVAL_VM_FUNCTION'
    title: 'Node Unsafe eval/vm/new Function'
    vuln: 'code_injection'
    sev: 'Critical'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-94'
    owasp: 'A03:2021 - Injection'
    pattern: '\beval\s*\([^)]*(?:req\.|request|body|query|params)?|new\s+Function\s*\([^)]*(?:req\.|request|body|query|params)?|vm\.runIn(?:This|New)Context\s*\('
    contract_ref: 'code_injection'
    remediation: ['Remove eval(), vm execution and new Function() for untrusted input.', 'Use schema-validated data, safe interpreters or fixed allow-listed commands.', 'Apply CSP and runtime sandboxing where dynamic execution cannot be avoided.']
  - id: 'NODE_FS_TRAVERSAL'
    title: 'Node fs Path Traversal Indicator'
    vuln: 'path_traversal'
    sev: 'High'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-22'
    owasp: 'A01:2021 - Broken Access Control'
    pattern: 'fs\.(?:readFile|writeFile|createReadStream|unlink)\s*\([^)]*(?:req\.|query|body|params)'
    contract_ref: 'path_traversal'
  - id: 'NODE_SERIALIZE_UNSERIALIZE'
    title: 'node-serialize Unsafe Unserialize'
    vuln: 'insecure_deserialization'
    sev: 'Critical'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
    pattern: 'node-serialize|\.unserialize\s*\('
    contract_ref: 'insecure_deserialization'
    remediation: ['Do not unserialize untrusted node-serialize payloads.', 'Use JSON.parse for data-only payloads and reject functions/prototypes.', 'Apply integrity checks and strict type allow-lists.']
  - id: 'NODE_JSYAML_UNSAFE_LOAD'
    title: 'js-yaml Unsafe load'
    vuln: 'insecure_deserialization'
    sev: 'High'
    langs: ['javascript', 'typescript']
    cwe: 'CWE-502'
    owasp: 'A08:2021 - Software and Data Integrity Failures'
